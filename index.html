<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WØRN</title>
  <link rel="icon" type="image/svg+xml" href="worn_logo_volt_bueno.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #0A0A0A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(16px, 4vw, 28px);
      width: 100%;
      max-width: 640px;
      text-align: center;
    }

    /* ── Logo draw animation ──────────────────────────── */

    .logo {
      width: clamp(48px, 12vw, 72px);
      height: clamp(48px, 12vw, 72px);
    }

    /* Circle: circumference = 2π × 75 ≈ 472 */
    #circle {
      stroke-dasharray: 472;
      stroke-dashoffset: 472;
      animation: draw 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* Diagonal: length = √(110²+110²) ≈ 156 */
    #diag {
      stroke-dasharray: 156;
      stroke-dashoffset: 156;
      animation: draw 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.9s forwards;
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    /* ── Text fade in after drawing ends (1.5s) ─────────── */

    .title,
    .subtitle,
    .coming-soon {
      opacity: 0;
      animation: fadeIn 0.7s ease forwards;
    }

    .title        { animation-delay: 1.6s; }
    .subtitle     { animation-delay: 1.75s; }
    .coming-soon  { animation-delay: 1.9s; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Typography ──────────────────────────────────────── */

    .title {
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: clamp(64px, 20vw, 140px);
      color: #F5F5F0;
      letter-spacing: -0.03em;
      line-height: 1;
      user-select: none;
    }

    .subtitle {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: clamp(13px, 3.5vw, 18px);
      color: #888888;
      letter-spacing: 0.04em;
    }

    .coming-soon {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: clamp(10px, 2.5vw, 11px);
      color: #888888;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    @media (max-width: 360px) {
      .title { font-size: 58px; }
    }

    /* ── Footer ──────────────────────────────────────────── */

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 28px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 22px;
      opacity: 0;
      animation: fadeIn 0.7s ease 2.1s forwards;
    }

    .social-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555555;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .social-links a:hover { color: #E8FF47; }

    .social-links svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .btn-info {
      opacity: 0;
      animation: fadeIn 0.7s ease 2.1s forwards;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #0A0A0A;
      background: #E8FF47;
      border: none;
      border-radius: 2px;
      padding: 10px 22px;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .btn-info:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container">

    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200" aria-hidden="true">
      <circle id="circle" cx="0" cy="0" r="75" fill="none" stroke="#E8FF47" stroke-width="18" stroke-linecap="round"/>
      <path   id="diag"   d="M55,-55 L-55,55" fill="none" stroke="#E8FF47" stroke-width="20" stroke-linecap="round"/>
    </svg>

    <h1 class="title">WØRN</h1>
    <p class="subtitle">Your style. Your identity.</p>
    <span class="coming-soon">Summer 2026</span>

    <div class="social-links">

          <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.77a4.85 4.85 0 0 1-1.01-.08z"/>

        </svg>
      </a>
    </div>

  </div>

  <footer>
    <button class="btn-info">Solicitar información</button>
  </footer>

</body>
</html>
