<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nueva contraseña · WØRN</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0A0A0A; color: #F5F5F0; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .card { width: 100%; max-width: 380px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p.sub { color: #888; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: #888; margin: 0 0 6px; }
  input {
    width: 100%; padding: 14px; margin-bottom: 14px;
    background: #1E1E1E; border: 1px solid #2A2A2A; border-radius: 12px;
    color: #F5F5F0; font-size: 16px;
  }
  input:focus { outline: none; border-color: #E8FF47; }
  button {
    width: 100%; padding: 15px; border: 0; border-radius: 14px;
    background: #E8FF47; color: #0A0A0A; font-size: 16px; font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 14px; line-height: 1.5; margin-top: 16px; }
  .err { color: #FF6B6B; }
  .ok  { color: #E8FF47; }
  .brand { color: #555; font-size: 12px; margin-top: 32px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>Nueva contraseña</h1>
  <p class="sub" id="sub">Elige una contraseña nueva para tu cuenta de WØRN.</p>

  <form id="form">
    <label for="pw">Contraseña</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="6" required>

    <label for="pw2">Repítela</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="6" required>

    <button type="submit" id="btn">Guardar contraseña</button>
  </form>

  <div class="msg" id="msg"></div>
  <p class="brand">WØRN · Tu armario. Tu comunidad.</p>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://eiwoeywswuwqosojunrg.supabase.co';
// Clave pública anon: la misma que lleva la app, no es secreta.
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpd29leXdzd3V3cW9zb2p1bnJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwODkyMTUsImV4cCI6MjA5MTY2NTIxNX0.7sssT-cuFYFeirmW94ugqqUiqi28KXQOSdF2ElBi2yM';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { detectSessionInUrl: true, flowType: 'pkce' }
});

const form = document.getElementById('form');
const btn  = document.getElementById('btn');
const msg  = document.getElementById('msg');
const sub  = document.getElementById('sub');

function show(text, cls) { msg.className = 'msg ' + cls; msg.textContent = text; }

// El enlace del correo trae el token. Según la configuración llega como
// ?code=... (PKCE) o en el fragmento #access_token=...&type=recovery.
// Se cubren los dos casos.
async function establecerSesion() {
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  if (code) {
    const { error } = await supabase.auth.exchangeCodeForSession(code);
    return !error;
  }

  const hash = new URLSearchParams(location.hash.slice(1));
  const access_token = hash.get('access_token');
  const refresh_token = hash.get('refresh_token');
  if (access_token && refresh_token) {
    const { error } = await supabase.auth.setSession({ access_token, refresh_token });
    return !error;
  }

  const { data } = await supabase.auth.getSession();
  return Boolean(data.session);
}

const listo = await establecerSesion();
if (!listo) {
  form.style.display = 'none';
  sub.textContent = '';
  show('Este enlace no es válido o ha caducado. Pide uno nuevo desde la app.', 'err');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw  = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;

  if (pw !== pw2) return show('Las contraseñas no coinciden.', 'err');
  if (pw.length < 6) return show('Usa al menos 6 caracteres.', 'err');

  btn.disabled = true;
  show('Guardando…', '');

  const { error } = await supabase.auth.updateUser({ password: pw });

  if (error) {
    btn.disabled = false;
    return show(error.message, 'err');
  }

  form.style.display = 'none';
  sub.textContent = '';
  show('Listo. Ya puedes entrar en WØRN con tu contraseña nueva.', 'ok');
  await supabase.auth.signOut();
});
</script>
</body>
</html>
